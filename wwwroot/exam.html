<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>纽威石油设备苏州有限公司考试管理系统 - 考试</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar" id="navbar" style="display:none;">
    <span class="title" id="navTitle">纽威石油设备苏州有限公司考试管理系统</span>
    <div class="user-info">
      <span id="userName"></span>
      <button class="btn-logout" onclick="logout()">退出</button>
    </div>
  </nav>

  <!-- ===== 页面1：考试列表 ===== -->
  <div id="pageList" style="display:none;">
    <div class="container">
      <div class="page-header">
        <h2>📋 可用考试</h2>
        <p>选择一场考试开始作答</p>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary btn-sm" onclick="loadExams()">🔄 刷新列表</button>
      </div>
      <ul class="exam-list" id="examList"></ul>
    </div>
  </div>

  <!-- ===== 页面1.5：考前等待（倒计时）页 ===== -->
  <div id="pageWait" style="display:none;">
    <div class="container">
      <div class="card result-card" id="waitCard" style="text-align:center;">
        <div style="font-size:15px;color:var(--text-secondary);margin-bottom:6px;">考试即将开始</div>
        <h2 id="waitTitle" style="margin:0 0 14px;"></h2>
        <div id="waitInfo" style="font-size:13px;color:var(--text-secondary);line-height:1.9;margin-bottom:18px;"></div>
        <div style="font-size:14px;color:var(--text-secondary);margin-bottom:6px;">⏳ 距考试开始还有</div>
        <div id="waitCountdown" style="font-size:46px;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums;letter-spacing:2px;">--:--</div>
        <button class="btn btn-primary" id="waitEnterBtn" style="margin-top:20px;" disabled onclick="startExam(currentWaitId)">进入考试</button>
        <div id="waitHint" style="font-size:12px;color:var(--text-secondary);margin-top:10px;">考试开始前10分钟已开放登录；开始后即可进入作答</div>
      </div>
      <div style="margin-top:20px;text-align:center;">
        <button class="btn btn-outline" onclick="backToList()">← 返回考试列表</button>
      </div>
    </div>
  </div>

  <!-- ===== 页面2：答题页 ===== -->
  <div id="pageExam" style="display:none;">
    <!-- 倒计时 -->
    <div class="exam-timer" id="timerBar" style="display:none;">
      <span>⏱ 剩余时间</span>
      <span class="time" id="timerDisplay">--:--</span>
    </div>

    <div class="container" id="questionContainer" style="padding-bottom:80px;"></div>

    <!-- 底部提交栏 -->
    <div class="submit-bar" id="submitBar" style="display:none;">
      <button class="btn btn-outline flex-1" onclick="saveDraft()">💾 保存草稿</button>
      <button class="btn btn-danger flex-1" onclick="confirmSubmit()">📤 提交试卷</button>
    </div>
  </div>

  <!-- ===== 页面3：排名/成绩 ===== -->
  <div id="pageResult" style="display:none;">
    <div class="container">
      <div class="card result-card" id="resultCard"></div>
      <div class="ranking-panel" id="rankingPanel" style="display:none;">
        <h3>🏆 实时排名</h3>
        <ul class="ranking-list" id="rankingList"></ul>
      </div>
      <div style="margin-top:20px;text-align:center;">
        <button class="btn btn-outline" onclick="backToList()">← 返回考试列表</button>
      </div>
    </div>
  </div>

  <!-- ===== 考卷回顾 Modal ===== -->
  <div class="modal-overlay" id="reviewOverlay">
    <div class="modal review-modal">
      <h3 id="reviewTitle">📄 考卷回顾</h3>
      <div id="reviewBody" style="max-height:62vh;overflow:auto;margin-top:10px;"></div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeReview()">关闭</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=8"></script>
  <script>
    // ---- 状态 ----
    let currentExam = null;
    let currentSession = null;
    let currentSessionId = null; // 当前答卷（会话）ID，提交与回看均以此为锚，确保共享账号下回看的是自己刚答的那份
    let questions = [];
    let timerInterval = null;
    let remainingSeconds = 0;
    let draftAnswers = {};
    let currentWaitId = null;     // 当前等待页对应的考试 ID
    let waitTimer = null;         // 等待页倒计时定时器
    let currentEntrySlug = null;  // 通过独立入口（/e/xxx）进入时携带的 slug
    const PRE_WINDOW_MIN = 10;    // 考前允许登录/进入等待页的分钟数

    // ---- 初始化 ----
    (function init() {
      const user = getUser();
      currentEntrySlug = getQueryParam('e');
      if (!user.role) {
        location.href = 'index.html'
          + (currentEntrySlug ? '?e=' + encodeURIComponent(currentEntrySlug) : '')
          + (currentEntrySlug ? '&' : '?') + 'ts=' + Date.now();
        return;
      }
      if (user.role === 'Admin') { location.href = '/admin'; return; }

      $('#navbar').style.display = 'flex';
      $('#userName').textContent = user.displayName || user.username;

      if (currentEntrySlug) {
        // 通过考试独立入口进入：跳过列表，直达该场倒计时页
        enterBySlug(currentEntrySlug);
      } else {
        showPage('list');
        loadExams();
      }
    })();

    function showPage(page) {
      $('#pageList').style.display   = page === 'list' ? '' : 'none';
      $('#pageWait').style.display   = page === 'wait' ? '' : 'none';
      $('#pageExam').style.display   = page === 'exam' ? '' : 'none';
      $('#pageResult').style.display = page === 'result' ? '' : 'none';
      $('#timerBar').style.display   = page === 'exam' ? '' : 'none';
      $('#submitBar').style.display  = page === 'exam' ? '' : 'none';
      if (page === 'list') $('#navTitle').textContent = '📋 可用考试';
      if (page === 'wait') $('#navTitle').textContent = '⏳ 考前等待';
      if (page === 'exam') $('#navTitle').textContent = '📝 正在答题';
      if (page === 'result') $('#navTitle').textContent = '📊 考试结果';
    }

    // ---- 加载考试列表 ----
    let examListCache = [];
    async function loadExams() {
      try {
        const list = await api('GET', '/exams/available');
        examListCache = list || [];
        const el = $('#examList');
        if (!examListCache.length) {
          el.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无可用考试</p><p style="font-size:12px;margin-top:4px;">请等待管理员发布考试</p></div>';
          return;
        }
        const now = Date.now();
        el.innerHTML = list.map(ex => {
          const start = ex.startTime ? new Date(ex.startTime).getTime() : 0;
          const end = ex.endTime ? new Date(ex.endTime).getTime() : 0;
          const loginOpen = start ? start - PRE_WINDOW_MIN * 60000 : 0; // 考前 10 分钟开放
          let clickable = true, label = '进入考试', cls = 'status-pending', action = `onclick="startExam(${ex.id})"`;
          if (end && now >= end) { clickable = false; label = '已结束'; cls = 'status-started'; }
          else if (start && now < start) {
            if (loginOpen && now >= loginOpen) {
              // 考前 10 分钟窗口内：可进入等待页（倒计时）
              clickable = true; label = '即将开始'; cls = 'status-started';
              action = `onclick="openWait(${ex.id})"`;
            } else {
              clickable = false; label = '未开始'; cls = 'status-started';
            }
          }
          const timeStr = ex.startTime ? new Date(ex.startTime).toLocaleString() : '-';
          const endStr = ex.endTime ? new Date(ex.endTime).toLocaleString() : '-';
          return `
          <li class="exam-item" ${clickable ? action : ''}>
            <div class="exam-info">
              <div class="exam-title">${escHtml(ex.title)}</div>
              <div class="exam-meta">
                ${timeStr} ~ ${endStr} · 时长 ${ex.durationMinutes} 分钟 · 总分 ${ex.totalScore} 分
              </div>
            </div>
            <div class="exam-action">
              <span class="exam-status ${cls}">${label}</span>
            </div>
          </li>`;
        }).join('');
      } catch(e) { toast('加载失败：' + e.message, 'error'); }
    }

    // ---- 通过独立入口 slug 进入：取该场公开信息后直达倒计时页 ----
    async function enterBySlug(slug) {
      try {
        const entry = await api('GET', '/exams/entry/' + encodeURIComponent(slug));
        const ex = {
          id: entry.examId,
          title: entry.title,
          startTime: entry.startTime,
          endTime: entry.endTime,
          durationMinutes: entry.durationMinutes,
          totalScore: entry.totalScore
        };
        showWait(ex);
      } catch(e) {
        toast('考试入口无效或已失效：' + e.message, 'error');
        showPage('list');
        loadExams();
      }
    }

    // ---- 考前等待页（倒计时）----
    function openWait(examId) {
      const ex = (examListCache || []).find(e => e.id === examId) || null;
      if (!ex) { toast('未找到考试信息', 'error'); return; }
      showWait(ex);
    }

    function showWait(ex) {
      if (!ex) { toast('未找到考试信息', 'error'); return; }
      currentWaitId = ex.id;
      $('#waitTitle').textContent = ex.title || '考试';
      const timeStr = ex.startTime ? new Date(ex.startTime).toLocaleString() : '-';
      const endStr = ex.endTime ? new Date(ex.endTime).toLocaleString() : '-';
      $('#waitInfo').innerHTML =
        `考试时长：<b>${ex.durationMinutes}</b> 分钟　·　总分：<b>${ex.totalScore}</b> 分<br>` +
        `开始时间：${timeStr}<br>结束时间：${endStr}`;
      showPage('wait');
      startWaitCountdown(ex);
    }

    function startWaitCountdown(ex) {
      if (waitTimer) { clearInterval(waitTimer); waitTimer = null; }
      const startMs = ex.startTime ? new Date(ex.startTime).getTime() : 0;
      const btn = $('#waitEnterBtn');
      const update = () => {
        const remain = startMs - Date.now();
        if (remain <= 0) {
          $('#waitCountdown').textContent = '00:00';
          btn.disabled = false;
          if (waitTimer) { clearInterval(waitTimer); waitTimer = null; }
          return;
        }
        const totalSec = Math.floor(remain / 1000);
        const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
        const s = (totalSec % 60).toString().padStart(2, '0');
        $('#waitCountdown').textContent = `${m}:${s}`;
        btn.disabled = true;
      };
      update();
      waitTimer = setInterval(update, 1000);
    }

    // ---- 开始考试 ----
    async function startExam(examId) {
      try {
        // 直接调用开始接口：后端会复用进行中的答卷，并返回题目 + 截止时间
        const resp = await api('POST', `/exams/${examId}/start`);
        currentSession = resp;
        currentSessionId = resp.sessionId;
        currentExam = { id: examId };
        questions = resp.questions || [];
        draftAnswers = {};
        try { draftAnswers = JSON.parse(localStorage.getItem(`draft_${examId}`) || '{}'); } catch {}

        showPage('exam');
        renderQuestions();
        startTimerTo(resp.endTime);

        // 连接实时排名
        connectRanking(examId, updateRanking);

        toast('考试已开始，祝你好运！', 'success');
      } catch(e) { toast(e.message, 'error'); }
    }

    function renderQuestions() {
      $('#questionContainer').innerHTML = questions.map((q, i) => 
        renderQuestion(q, i + 1, draftAnswers)
      ).join('');
    }

    // ---- 倒计时（以考试的结束时间为截止）----
    function startTimerTo(endTimeIso) {
      const endMs = new Date(endTimeIso).getTime();
      const update = () => {
        remainingSeconds = Math.max(0, Math.floor((endMs - Date.now()) / 1000));
        updateTimerDisplay();
        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          toast('时间到！自动提交试卷', 'warn');
          doSubmit(null, false);
        }
      };
      update();
      timerInterval = setInterval(update, 1000);
    }

    function updateTimerDisplay() {
      const el = $('#timerDisplay');
      el.textContent = formatTime(remainingSeconds);
      if (remainingSeconds <= 60) el.classList.add('urgent');
      else el.classList.remove('urgent');
    }

    // ---- 保存草稿 ----
    function saveDraft() {
      draftAnswers = collectAnswers();
      localStorage.setItem(`draft_${currentExam.id}`, JSON.stringify(draftAnswers));
      toast('草稿已保存', 'success');
    }

    // ---- 确认提交 ----
    function confirmSubmit() {
      const answers = collectAnswers();
      const unanswered = questions.filter(q => !answers[q.id]).length;
      let msg = `确定要提交试卷吗？`;
      if (unanswered > 0) msg += `\n（还有 ${unanswered} 题未作答）`;
      if (confirm(msg)) doSubmit(answers);
    }

    async function doSubmit(answers, early = true) {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      
      answers = answers || collectAnswers();
      const answeredCount = Object.values(answers).filter(v => v).length;

      // 后端 SubmitRequest.Answers 是 List<SubmitAnswer>{questionId,selected}
      // 前端 collectAnswers() 返回 dict {qidStr: selStr}，这里转成数组
      const payload = {
        sessionId: currentSessionId,
        answers: Object.entries(answers)
          .filter(([, v]) => v)                     // 跳过未作答（空串）
          .map(([k, v]) => ({ questionId: Number(k), selected: v })),
        early: early
      };

      try {
        const result = await api('POST', `/exams/${currentExam.id}/submit`, payload);
        
        // 清除草稿
        localStorage.removeItem(`draft_${currentExam.id}`);
        
        // 显示结果
        showResult(result, answeredCount);
      } catch(e) {
        toast('提交失败：' + e.message, 'error');
      }
    }

    // ---- 显示结果 & 排名 ----
    function showResult(result, answeredCount) {
      showPage('result');
      const pct = result.totalScore > 0 ? Math.round(result.score / result.totalScore * 100) : 0;
      $('#resultCard').innerHTML = `
        <div class="result-score">${result.score}</div>
        <div class="result-label">/ ${result.totalScore} 分 （${pct}%）</div>
        <div class="result-detail">
          <div class="result-row"><span>考试名称</span><span>${escHtml(result.examTitle || '-')}</span></div>
          <div class="result-row"><span>答题数量</span><span>${answeredCount} / ${questions.length}</span></div>
          <div class="result-row"><span>正确题数</span><span>${result.correctCount || '-'}</span></div>
          <div class="result-row"><span>提交时间</span><span>${new Date().toLocaleString()}</span></div>
        </div>
        <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="loadRanking()">🏆 查看实时排名</button>
          <button class="btn btn-outline" onclick="viewReview()">📄 查看考卷</button>
        </div>`;
      
      // 自动加载排名
      setTimeout(() => loadRanking(), 500);
    }

    async function loadRanking() {
      try {
        const data = await api('GET', `/exams/${currentExam.id}/ranking`);
        updateRanking(data);
      } catch(e) { console.error('Ranking load error:', e); }
    }

    function updateRanking(data) {
      const panel = $('#rankingPanel');
      const list = $('#rankingList');
      panel.style.display = '';

      // 兼容两种返回结构：裸数组 或 { rankings: [...] }
      const arr = Array.isArray(data) ? data : (data && data.rankings) || [];
      if (!arr.length) {
        list.innerHTML = '<li class="empty-state"><p>暂无排名数据</p></li>';
        return;
      }

      list.innerHTML = arr.map((r, i) => {
        const posClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : 'rank-n';
        return `<li class="ranking-item">
          <span class="rank-pos ${posClass}">${i + 1}</span>
          <span class="rank-name">${escHtml(r.displayName || r.username)}</span>
          <span class="rank-score">${r.score}</span>
        </li>`;
      }).join('');
    }

    // ---- 查看考卷（提交/强制提交后）----
    async function viewReview() {
      try {
        const qs = currentSessionId ? `?sessionId=${currentSessionId}` : '';
        const data = await api('GET', `/exams/${currentExam.id}/review${qs}`);
        renderReview(data);
      } catch(e) {
        toast('无法查看考卷：' + (e.message || ''), 'error');
      }
    }

    function normalizeLetters(s) {
      if (!s) return [];
      return s.toUpperCase().split('').filter(c => c >= 'A' && c <= 'D').sort();
    }

    function renderReview(data) {
      const body = $('#reviewBody');
      $('#reviewTitle').textContent = '📄 考卷回顾 — ' + (data.title || '');
      body.innerHTML = (data.questions || []).map((q, i) => {
        const typeName = q.type === 'Single' ? '单选题' : q.type === 'Multiple' ? '多选题' : '判断题';
        const sel = normalizeLetters(q.selected);
        const cor = normalizeLetters(q.correctAnswer);
        const optsHtml = Object.entries(q.options || {}).map(([k, v]) => {
          const isSel = sel.includes(k);
          const isCor = cor.includes(k);
          let cls = 'review-opt';
          let mark = '';
          if (isCor && isSel) { cls += ' correct'; mark = '✔ 你的答案 · 正确'; }
          else if (isCor && !isSel) { cls += ' missed'; mark = '（正确答案）'; }
          else if (!isCor && isSel) { cls += ' wrong'; mark = '✘ 你的答案 · 错误'; }
          return `<div class="${cls}">
              <span class="opt-key">${k}</span>
              <span class="opt-text">${escHtml(v)}</span>
              <span class="opt-mark">${mark}</span>
            </div>`;
        }).join('');
        const selText = q.selected ? q.selected : '未作答';
        const footClass = q.isCorrect ? 'tag-correct' : 'tag-wrong';
        const footText = q.isCorrect ? '✅ 正确' : '❌ 错误';
        return `<div class="review-q ${q.isCorrect ? '' : 'wrong'}">
            <div class="review-q-head">第 ${i + 1} 题</div>
            <div class="review-q-meta">${typeName} · ${q.score} 分</div>
            <div class="review-q-content">${escHtml(q.content)}</div>
            ${optsHtml}
            <div class="review-q-foot">
              <span>你的答案：<b>${escHtml(selText)}</b></span>
              <span>正确答案：<b>${escHtml(q.correctAnswer || '-')}</b></span>
              <span class="${footClass}">${footText} · 得分 ${q.scoreGot}</span>
            </div>
          </div>`;
      }).join('');
      $('#reviewOverlay').classList.add('active');
    }

    function closeReview() {
      $('#reviewOverlay').classList.remove('active');
    }

    function backToList() {
      if (waitTimer) { clearInterval(waitTimer); waitTimer = null; }
      if (rankingConn) { try { rankingConn.close(); } catch (e) {} rankingConn = null; }
      if (currentEntrySlug) {
        // 通过独立入口进入：返回该场考试的倒计时页（重新加载入口）
        location.href = 'exam.html?e=' + encodeURIComponent(currentEntrySlug);
        return;
      }
      showPage('list');
      loadExams();
    }

    // ---- 工具 ----
    function escHtml(s) {
      if (!s) return '';
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
</body>
</html>
