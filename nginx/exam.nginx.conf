# ============================================================
#  ExamSystem —— Nginx 反代 + HTTPS（放在 Linux 主机上，非容器）
# ------------------------------------------------------------
#  用法：
#   1) 把本文件放到 /etc/nginx/conf.d/exam.conf
#   2) 用 certbot 申请证书：
#        certbot --nginx -d exam.example.com
#      （certbot 会自动改写 443 块并配置证书路径，下面为示意）
#   3) nginx -t && systemctl reload nginx
#
#  前置：docker-compose 已把容器 5000 映射到主机 127.0.0.1:5000
# ============================================================

server {
    listen 80;
    server_name exam.example.com;
    # HTTP 一律跳 HTTPS
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name exam.example.com;

    ssl_certificate     /etc/letsencrypt/live/exam.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exam.example.com/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # SignalR / WebSocket 升级（实时排名必需）
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
